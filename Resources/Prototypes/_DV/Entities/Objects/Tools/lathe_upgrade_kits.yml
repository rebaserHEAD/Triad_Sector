- type: entity
  abstract: true
  parent: BaseItem
  id: BaseLatheUpgradeKit
  components:
  - type: Sprite
    sprite: _DV/Objects/Tools/lathe_upgrade_kit.rsi
    state: icon
  - type: UpgradeKit
    whitelist:
      components:
      - Lathe
    blacklist:
      components:
      - UpgradedMachine
    # ALWAYS add UpgradedMachine to components in inheritors

- type: entity
  parent: BaseLatheUpgradeKit
  id: LatheUpgradeKitHyper
  name: hyper-convection upgrade kit
  description: An upgrade kit with all the parts needed to upgrade a lathe. This one will speed up production at the cost of producing heat. # Triad: reflavored, was a material-saver
  components:
  - type: UpgradeKit
    components:
    - type: UpgradedMachine
      upgrade: lathe-upgrade-kit-hyper-convection
    - type: LatheUpgrade
      # Triad: material efficiency removed from upgrades entirely - printing under full material
      # cost arbitrages the flat-priced market. Repurposed as the milder speed kit: slower than
      # cryo (0.5) but it heats the room instead of freezing it.
      # materialUseMultiplier: 0.8
      # timeMultiplier: 1.5
      timeMultiplier: 0.75
    - type: LatheHeatProducing
      temperatureCap: 373.15
    - type: ReagentSpeed
      solution: lube
      modifiers:
        SpaceLube: 0.5
        SpaceGlue: 5 # no change from normal lathe, overheat!!!

- type: entity
  parent: BaseLatheUpgradeKit
  id: LatheUpgradeKitCryo
  name: cryo-stabilizing upgrade kit
  description: An upgrade kit with all the parts needed to upgrade a lathe. This one will speed up production at the cost of freezing the area.
  components:
  - type: UpgradeKit
    components:
    - type: UpgradedMachine
      upgrade: lathe-upgrade-kit-cryo-stabilizing
    - type: LatheUpgrade
      timeMultiplier: 0.5
    - type: LatheHeatProducing
      energyPerSecond: -20000 # cool instead of heat, not as extreme

- type: entity
  id: BaseStationCargoMarket
  abstract: true
  components:
  - type: CargoMarketData
    whitelist:
      tags:
      - Ore
      - Sheet
      - Metal
      - Ingot
      - PointDisk #Mono start
      - Brutepack
      - Ointment
      - Bloodpack #Mono end
      - RawMaterial
      - CrystalRed
      - CrystalGreen
      - CrystalPink
      - CrystalOrange
      - CrystalBlue
      - CrystalCyan
      components:
      - Material
      - ConstructionMaterials
      - ToolRefinable
      - MachinePart
      - VendingMachineRestock
      - Seed
      - MachineBoard
      - ComputerBoard
    # Triad: the list model is inverted. The whitelist above lists as-is; this blacklist is the
    # HARD-REJECT roster - cash-only export, never listed, never shredded; and everything on
    # neither list SHREDS into pools and listings via its price manifest. The old shred-class
    # entries (Trash/Mail/Paper, Anchorable, Food, SpaceGarbage, Gun, Ammo, Drink, GasTank,
    # Explosive, RCD, Storage/StorageFill) came off - default shred covers them - and the
    # UraniumMaterials whitelistOverride died with the Food entry.
    blacklist:
      components:
      - Currency # No selling money.
      - Contraband # Sells clean for cash - the mall does not launder smuggled goods into pools.
      - Actor
      - Mind # Players
      - MindContainer # Positronic brains
      - Body # No corpses
      - MobPrice # Animals (live or dead) and the like
      - XenoArtifact # Unique, abusable for research points


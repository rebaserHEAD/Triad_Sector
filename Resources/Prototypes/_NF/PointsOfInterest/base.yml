- type: pointOfInterest
  parent: BaseMobilePOI
  id: BasePOI
  abstract: true
  addComponents:
  - type: ForceAnchor

# Mono

- type: pointOfInterest
  id: BaseMobilePOI
  abstract: true
  minimumDistance: 4000 # Some sane defaults
  maximumDistance: 8000
  spawnGamePreset: [ TriadStandard, NFAdventure, NFPirate, MonoAllAtOnce ] # Triad
  spawnGroup: Optional
  addComponents:
  - type: IFF
    color: "#ffa600"
    readOnly: true
  # Triad: a station holds the space around it real the way a crewed ship does. Without this a POI
  # sits in undescribed space until somebody flies out to it, and its own radar would paint nothing.
  - type: DescribeAnchor

- type: pointOfInterest
  parent: BaseMobilePOI
  id: BaseRepairablePOI
  abstract: true
  addComponents:
  - type: InitRepairSnapshot

# mono edit
- type: sectorService
  id: BankAccounts
  components:
  - type: SectorBank
    # Triad: passive ticking income retired and starting floats zeroed. Department base income is
    # now the sector purchase-tax pot (SectorTaxShare, split evenly four ways); department activity
    # income (ItemTax, AtmTax, PowerTransmission, smuggling) stays direct. BlackMarket earns only
    # from the smuggling loop.
    accounts:
      Frontier:
        !type:SectorBankAccountInfo
        balance: 0 # Triad: 8000 >> 0
        increasePerSecond: 0 # Triad: 14 >> 0 (was ~50K per hour, minimum wage employees!)
      TDF:
        !type:SectorBankAccountInfo
        balance: 0 # Triad: 8000 >> 0
        increasePerSecond: 0 # Triad: 42 >> 0 (was ~150K per hour, about enough for minimum wage for the default TDF size)
      Medical:
        !type:SectorBankAccountInfo
        balance: 0 # Triad: 8000 >> 0
        increasePerSecond: 0 # Triad: 18 >> 0 (was ~65K per hour, a bit over for the DOC MOM's wage.)
      BlackMarket:
        !type:SectorBankAccountInfo
        balance: 0 # Triad: 8000 >> 0
        increasePerSecond: 0 # Triad: 18 >> 0 (was ~65K per hour; smuggling feeds it directly now)
      Edison: # Triad: coyote's power plant account; the plant earns by selling power
        !type:SectorBankAccountInfo
        balance: 0 # Triad: 8000 >> 0
        increasePerSecond: 0 # Triad: 1 >> 0
# mono edit end

